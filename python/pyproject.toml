[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-adbc-integrations"
version = "0.1.0"
description = "Optional framework adapters for the Redis ADBC driver"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["adbc-driver-redis[dbapi]>=0.0.31"]

[project.urls]
Homepage = "https://github.com/Redislabs-Solution-Architects/redis-adbc-integrations"
Issues = "https://github.com/Redislabs-Solution-Architects/redis-adbc-integrations/issues"

[project.optional-dependencies]
airflow = ["apache-airflow-providers-apache-arrow>=0.2.0", "pyarrow>=26.0.1"]
dagster = ["dagster>=1.13.30", "pyarrow>=26.0.1"]
dask = ["dask[dataframe,distributed]>=2026.8.0", "pandas>=3.1.1", "pyarrow>=26.0.1"]
ray = ["ray[data]==2.60.0", "pyarrow>=26.0.1"]
prefect = ["prefect>=3.9.3,<4", "pyarrow>=26.0.1"]
dlt = ["dlt[parquet]>=1.32.0,<2", "pyarrow>=26.0.1"]
superset = ["apache-superset==6.1.0", "sqlalchemy>=2.1.9"]
analytics-tests = ["pytest>=9.2.0", "polars>=2.1.0", "dagster-adbc>=0.0.2", "dagster>=1.13.30", "dask[dataframe,distributed]>=2026.8.0", "pandas>=3.1.1", "prefect>=3.9.3,<4", "dlt[parquet]>=1.32.0,<2"]
airflow-tests = ["pytest>=9.2.0", "apache-airflow==3.4.0", "apache-airflow-providers-apache-arrow==0.2.0"]
ray-tests = ["ray[data]==2.60.0", "pytest>=9.2.0", "redis>=6"]

[project.entry-points."apache_airflow_provider"]
provider_info = "redis_adbc_integrations.airflow_provider:get_provider_info"

[project.entry-points."superset.db_engine_specs"]
redis = "redis_adbc_integrations.superset:RedisEngineSpec"
rediss = "redis_adbc_integrations.superset:RedisTLSEngineSpec"

[tool.setuptools.packages.find]
include = ["redis_adbc_integrations*"]
