name: Framework integrations

on:
  push:
    branches: [main]
  pull_request:
  # Pushes, pull requests and releases test the latest adbc-driver-redis
  # release from PyPI, as users install it. Nightly runs build and test the
  # latest upstream driver main.
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:
    inputs:
      driver_ref:
        description: Upstream driver branch or tag to build from source (empty = latest PyPI release)
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REDIS_ADBC_TELEMETRY_DISABLED: 'true'
  RAY_USAGE_STATS_ENABLED: '0'
  PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
  RUNTIME__DLTHUB_TELEMETRY: 'false'

jobs:
  helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check owned TLS worker lifecycle
        run: python -m unittest discover -s scripts -v

  integrations:
    name: ${{ matrix.suite }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: analytics
            arch: amd64
            runner: ubuntu-24.04
          - suite: analytics
            arch: arm64
            runner: ubuntu-24.04-arm
          - suite: airflow
            arch: amd64
            runner: ubuntu-24.04
          - suite: ray
            arch: amd64
            runner: ubuntu-24.04
    env:
      SSL_CERT_DIR: /etc/ssl/certs
      RUN_AIRFLOW_TESTS: '1'
      RUN_RAY_TESTS: '1'
      AIRFLOW_HOME: /tmp/redis-airflow-home
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PREFECT_HOME: /tmp/redis-prefect-home
    steps:
      - uses: actions/checkout@v7
      - name: Initialize driver fixtures
        run: git submodule update --init --depth 1 driver
      - name: Select driver under test
        id: driver
        env:
          DRIVER_REF: ${{ inputs.driver_ref || (github.event_name == 'schedule' && 'main') || '' }}
        run: |
          if [ -n "$DRIVER_REF" ]; then
            [[ "$DRIVER_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "invalid driver_ref: $DRIVER_REF" >&2; exit 2; }
            mode=source fixture_ref=$DRIVER_REF
          else
            # PyPI publication is the last step of a driver release, so its
            # latest version is the latest completed release users install.
            version=$(curl -fsSL --retry 3 https://pypi.org/pypi/adbc-driver-redis/json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
            [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?$ ]] || { echo "unexpected PyPI version: $version" >&2; exit 2; }
            mode=wheel fixture_ref=v${BASH_REMATCH[1]}
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          # Fixtures (redis-up, software-setup.sh) come from the same driver revision.
          git -C driver fetch --depth 1 origin "$fixture_ref"
          git -C driver checkout --detach FETCH_HEAD
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = wheel ]; then
            echo "Driver under test: adbc-driver-redis $version wheel from PyPI; fixtures from $fixture_ref ($(git -C driver rev-parse HEAD))"
          else
            echo "Driver under test: source build of $fixture_ref ($(git -C driver rev-parse HEAD))"
          fi | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v7
        if: steps.driver.outputs.mode == 'source'
        with:
          go-version-file: driver/go/go.mod
          cache-dependency-path: driver/go/go.sum
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install isolated framework environment
        env:
          SUITE: ${{ matrix.suite }}
          MODE: ${{ steps.driver.outputs.mode }}
          DRIVER_VERSION: ${{ steps.driver.outputs.version }}
        run: |
          uv venv --python 3.14 .venv
          if [ "$MODE" = wheel ]; then
            # The driver publishes binary wheels only; never fall back to a source build.
            uv pip install --python .venv/bin/python --only-binary adbc-driver-redis \
              "adbc-driver-redis[dbapi]==$DRIVER_VERSION" "./python[$SUITE-tests]"
            .venv/bin/python -c 'import importlib.metadata as m; from adbc_driver_redis import _driver_path; print("Installed adbc-driver-redis", m.version("adbc-driver-redis"), "with bundled", _driver_path())'
          else
            uv pip install --python .venv/bin/python ./driver/python "./python[$SUITE-tests]"
          fi
      - name: Build fixture driver
        if: steps.driver.outputs.mode == 'source'
        run: make -C driver/go build
      - name: Start verified Software fixture
        run: make -C driver/go redis-up
      - name: Exercise framework contracts
        env:
          SUITE: ${{ matrix.suite }}
          # Source builds load the fixture library; wheels use their bundled one.
          REDIS_ADBC_LIBRARY: ${{ steps.driver.outputs.mode == 'source' && format('{0}/driver/go/build/libadbc_driver_redis.so', github.workspace) || '' }}
        run: |
          [ -n "$REDIS_ADBC_LIBRARY" ] || unset REDIS_ADBC_LIBRARY
          case "$SUITE" in
            analytics) tests=(dagster dagster_adbc dask dask_write prefect dlt) ;;
            airflow) tests=(airflow airflow_hook) ;;
            ray) tests=(ray ray_arrow) ;;
            *) exit 2 ;;
          esac
          paths=()
          for test in "${tests[@]}"; do paths+=("$PWD/python/tests/test_$test.py"); done
          bash driver/go/software-setup.sh --exec "$PWD/.venv/bin/python" -m pytest -q -ra --tb=short             --junitxml="$PWD/framework-results.xml" "${paths[@]}"
      - name: Verify independent Ray worker TLS trust
        if: matrix.suite == 'ray'
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
          CANDIDATE_JUNIT_XML: ${{ github.workspace }}/ray-tls-results.xml
          REDIS_ADBC_INSTALLED_DRIVER: ${{ steps.driver.outputs.mode == 'wheel' && '1' || '' }}
        run: python/scripts/run-ray-tls-candidates.sh
      - name: Upload framework results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-${{ matrix.suite }}-${{ matrix.arch }}
          path: '*results.xml'
          if-no-files-found: warn
      - name: Remove owned fixture
        if: always()
        run: docker compose -f driver/go/compose.yaml down --volumes

  package:
    needs: [helpers, integrations]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Stamp independent release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv version --frozen --project python "${RELEASE_TAG#v}"
      - name: Build independent Python distribution
        run: uv build --project python --out-dir dist
      - name: Check package boundaries
        run: python3 scripts/check_package.py dist/*.whl
      - name: Checksum packages
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: python-distribution
          path: dist/
      - name: Publish release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
